# Server
server.port=8080
spring.application.name=ticketing-app

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketing_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET:mySecretKeyForRwandaTicketingAppMustBeLong256BitsAtLeast}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=noreply@rwandatickets.rw

# MTN MoMo
momo.api.base-url=https://sandbox.momodeveloper.mtn.com
momo.api.collection-subscription-key=${MOMO_COLLECTION_KEY}
momo.api.disbursement-subscription-key=${MOMO_DISBURSEMENT_KEY}
momo.api.environment=sandbox
momo.api.callback-host=${APP_BASE_URL:http://localhost:8080}

# App
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
spring.jpa.open-in-view=false
logging.level.rw.ticketing=DEBUG
